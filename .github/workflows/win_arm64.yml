name: Build for Windows ARM64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Release Windows ARM64
    # 🎯 核心改动：使用 ARM64 运行器
    runs-on: windows-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          # 在 ARM64 运行器上，subosito/flutter-action 会自动下载 ARM64 版本

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows
        continue-on-error: true

      - name: Add fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Build Windows ARM64
        run: |
          # 🎯 关键：在 ARM64 运行器上，fastforge 应该会自动识别架构
          # 如果 fastforge 不支持直接识别，可以尝试传递架构参数
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json"

      - name: Prepare Upload
        run: |
          mkdir -p Release/PiliPlus-Win-ARM64
          mkdir -p PiliPlus-Win-Setup-ARM64
          
          # 🎯 产物路径从 x64 改为 arm64
          # 注意：fastforge 可能输出到 build/windows/arm64/runner/Release/
          # 也可能是 build/windows/x64/runner/Release/（如果 fastforge 未自动适配）
          # 这里使用更通用的查找方式
          if (Test-Path "build/windows/arm64/runner/Release/*") {
            mv build/windows/arm64/runner/Release/* Release/PiliPlus-Win-ARM64/
          } elseif (Test-Path "build/windows/x64/runner/Release/*") {
            # 如果 fastforge 在 ARM64 运行器上仍输出到 x64，说明可能需要额外配置
            Write-Warning "Warning: ARM64 runner produced x64 output, check fastforge configuration"
            mv build/windows/x64/runner/Release/* Release/PiliPlus-Win-ARM64/
          } else {
            Write-Error "No build output found"
            exit 1
          }
          
          mv dist/**/*.exe PiliPlus-Win-Setup-ARM64/PiliPlus_windows_${{env.version}}_arm64_setup.exe

      - name: Compress
        run: |
          Compress-Archive -Path "Release/PiliPlus-Win-ARM64" -DestinationPath "PiliPlus_windows_${{env.version}}_arm64_portable.zip"
        shell: pwsh

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_windows_*_arm64_portable.zip
            PiliPlus-Win-Setup-ARM64/PiliPlus_windows_*_arm64_setup.exe

      - name: Upload windows file release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-file-arm64-release
          path: PiliPlus_windows_*_arm64_portable.zip

      - name: Upload windows setup release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-setup-arm64-release
          path: PiliPlus-Win-Setup-ARM64/PiliPlus_windows_*_arm64_setup.exe
