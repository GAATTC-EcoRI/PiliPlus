name: Build Windows ARM64

on:
  push:
    tags:
      - 'v*'           # 当你推送 v1.0.0 这样的标签时触发
  workflow_dispatch:   # 支持在 GitHub 网页上手动触发

jobs:
  build-windows-arm64:
    # 🎯 核心：使用 GitHub 官方提供的 ARM64 Windows 运行器
    runs-on: windows-arm64
    # 如果 github 默认运行器暂不可用，可改用自托管运行器（需配置）
    # runs-on: [self-hosted, windows, arm64]

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Flutter 环境
      #    在 ARM64 机器上，subosito/flutter-action 会自动下载 ARM64 版本的 Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 如果你的 pubspec.yaml 指定了 flutter 版本，可以启用下面这行
          # flutter-version-file: pubspec.yaml
          cache: true   # 缓存 SDK 和依赖，加速后续构建

      # 3. 获取项目依赖
      - name: Get dependencies
        run: flutter pub get

      # 4. 🎯 关键步骤：编译 Windows ARM64 版本
      #    在 ARM64 宿主机上，flutter build windows 会自动生成 ARM64 产物
      - name: Build Windows ARM64
        run: flutter build windows --release

      # 5. 上传编译产物
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-windows-arm64
          path: build/windows/arm64/runner/Release/
          # 保留目录结构，但压缩成 zip
          if-no-files-found: error
